[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ohcam"
version = "0.1.0"
description = "OHCAM: Online Hypothesis-Guided Learning of Conditional Action Models"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["ohcam*"]
